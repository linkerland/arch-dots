;==========================================================
;
;   Minimal Soft Black & Sage Green Floating Bar for i3
;   Polybar Configuration
;
;==========================================================

[colors]
; Softer matte charcoal instead of stark deep black
background = #13171b
background-alt = #1a2026
foreground = #cfd7de
foreground-muted = #6c7884

; Softer, warm sage / mint green instead of harsh electric neon
primary = #7eb898
secondary = #5d9876
accent = #8ed4aa
disabled = #38424b
alert = #e06c75

; Subtle, harmonious border rather than high-contrast outline
border = #293d33

[bar/main]
; Compact bar geometry
width = 84%
; Only slightly taller (36pt vs 34pt) to house larger fonts cleanly
height = 30pt

; Rounded pill corners
radius = 14

offset-x = 8%
offset-y = 14px

fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 1.5pt
border-color = ${colors.border}

padding-left = 4
padding-right = 4

; Widened module margins
module-margin = 3

; Separator dot
separator = " · "
separator-foreground = ${colors.disabled}

font-0 = Noto Sans:style=Medium:size=10;2
font-1 = DejaVuSansM Nerd Font:style=Regular:size=10;2
font-2 = DejaVu Sans Mono:size=10;2

; Spotify and system stats on the left, workspaces before the right-side applets
modules-left = spotify cpu memory
modules-center = date
modules-right = i3 battery tray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = i3
override-redirect = true

;----------------------------------------------------------
; Modules
;----------------------------------------------------------

[module/cpu]
type = internal/cpu
interval = 2.0
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.primary}
format = <label>
label = %percentage:2%%
label-foreground = ${colors.foreground}

[module/memory]
type = internal/memory
interval = 2.5
format-prefix = "󰘚  "
format-prefix-foreground = ${colors.primary}
format = <label>
label = %used% (%percentage_used%%)
label-foreground = ${colors.foreground}

[module/date]
type = internal/date
interval = 1.0
date = %a, %b %d
time = %H:%M:%S
format-prefix = "󰥔  "
format-prefix-foreground = ${colors.primary}
format = <label>
label = %date%  %time%
label-foreground = ${colors.foreground}

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT1
adapter = ADP1
poll-interval = 5

format-charging = <label-charging>
format-charging-prefix = "󰂄 "
format-charging-prefix-foreground = ${colors.primary}
label-charging = %percentage%% ↑
label-charging-foreground = ${colors.foreground}

format-discharging = <label-discharging>
format-discharging-prefix = "󰁹 "
format-discharging-prefix-foreground = ${colors.primary}
label-discharging = %percentage%% ↓
label-discharging-foreground = ${colors.foreground}

format-full = <label-full>
format-full-prefix = "󰁹 "
format-full-prefix-foreground = ${colors.primary}
label-full = 100%
label-full-foreground = ${colors.foreground}

format-low = <label-low>
format-low-prefix = "󰂃 "
format-low-prefix-foreground = ${colors.alert}
label-low = %percentage%% !
label-low-foreground = ${colors.alert}

[module/tray]
type = internal/tray
format-margin = 4px
tray-spacing = 10px
tray-size = 18px

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
format = <label-state>
label-focused = %name%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.foreground-muted}
label-unfocused-padding = 1
label-visible = %name%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

[module/spotify]
type = custom/script
exec = ~/.config/polybar/spotify.sh
interval = 1
format = <label>
label = %output%
label-foreground = ${colors.foreground}
format-padding = 1

[settings]
screenchange-reload = true
pseudo-transparency = true
