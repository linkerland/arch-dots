# Starship configuration matching minimal black & soft sage green theme

format = """$directory$git_branch$git_status$character"""
right_format = """$cmd_duration$jobs$status"""

add_newline = true

[character]
success_symbol = "[❯](bold #7eb898)"
error_symbol = "[❯](bold #e06c75)"
vimcmd_symbol = "[❮](bold #5d9876)"

[directory]
style = "bold #7eb898"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "#5d9876"
format = "on [$symbol$branch]($style) "

[git_status]
style = "#e06c75"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2_000
style = "#6c7884"
format = "took [$duration]($style) "

[jobs]
symbol = "✦ "
style = "#7eb898"

[status]
disabled = false
style = "#e06c75"
format = "[$symbol$status]($style) "
