#################################
#     Fast & Minimal Picom Conf #
#################################

# Backend & Performance
backend = "glx";
use-damage = true;
vsync = true;

# Subtle & Fast Animations / Fading
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 5;
fade-exclude = [];

# Corners
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Shadows (disabled for clean minimalism & speed)
shadow = false;

# Opacity Rules (Opaque everywhere except st)
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  "88:class_g = 'st-256color'",
  "88:class_g = 'st'",
  "88:class_g = 'St'"
];

# Dual-Kawase Blur - ONLY on st windows
blur: {
  method = "dual_kawase";
  strength = 6;
  background = true;
  background-frame = false;
  background-fixed = false;
};

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS",
  "class_g != 'st-256color' && class_g != 'st' && class_g != 'St'"
];

# Window types
wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
};
